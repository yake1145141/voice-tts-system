name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  self-test:
    name: 自测套件（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装 ffmpeg（分段音频拼接测试需要）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip wheel
          # setuptools 81+ 删掉了 pkg_resources，librosa 还在用它
          pip install "setuptools<81"
          # 只装测试需要的轻量依赖：不装 torch / tts-with-rvc，
          # 相关用例会自动跳过（见各测试文件里的 [SKIP] 分支），CI 才能跑得快
          pip install fastapi uvicorn pydantic pyyaml httpx

      - name: 查看环境
        run: |
          python -V
          pip -V
          ffmpeg -version | head -1

      - name: 运行全部自测
        run: python tests/run_all.py

  config-check:
    name: 服务端配置校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装运行依赖
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<81" fastapi uvicorn pydantic pyyaml

      - name: 校验 config.yaml 模板可用
        run: |
          cd tts-server
          python - <<'PY'
          import pathlib, sys, tempfile
          import yaml
          sys.path.insert(0, ".")
          from config import AppConfig

          # 仓库里带的是模板配置：模型名是占位符 MyVoice.pth，CI 上当然没有这个文件。
          # 所以先用 yaml 解析一遍确认语法，然后关掉 RVC 再做完整校验。
          # （注意不能直接改 rvc.enabled —— config.yaml 里 chunk/webui 也有 enabled 字段）
          src = pathlib.Path("config.yaml")
          data = yaml.safe_load(src.read_text(encoding="utf-8"))
          assert isinstance(data, dict), "config.yaml 顶层必须是键值对"
          data["rvc"]["enabled"] = False
          data["rvc"]["model"] = ""

          tmp = pathlib.Path(tempfile.mkdtemp()) / "config.yaml"
          tmp.write_text(yaml.safe_dump(data, allow_unicode=True), encoding="utf-8")
          cfg = AppConfig.load(tmp)

          server = cfg.describe()["server"]
          print("config.yaml 模板校验通过")
          print("  监听地址 :", server)
          print("  语音源   :", cfg.source)
          print("  分段字数 :", cfg.chunk.int("max_chars", 80))
          print("  控制台   :", "有密码" if cfg.webui.str("password", "") else "无密码")
          PY
