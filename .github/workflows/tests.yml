name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  self-test:
    name: 自测套件（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装 ffmpeg（分段音频拼接测试需要）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip wheel
          # setuptools 81+ 删掉了 pkg_resources，librosa 还在用它
          pip install "setuptools<81"
          # 只装测试需要的轻量依赖：不装 torch / tts-with-rvc，
          # 相关用例会自动跳过（见各测试文件里的 [SKIP] 分支），CI 才能跑得快
          pip install fastapi uvicorn pydantic pyyaml httpx

      - name: 查看环境
        run: |
          python -V
          pip -V
          ffmpeg -version | head -1

      - name: 运行全部自测
        run: python tests/run_all.py

  config-check:
    name: 服务端配置校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装运行依赖
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<81" fastapi uvicorn pydantic pyyaml

      - name: 校验 config.yaml 能通过解析
        run: |
          cd tts-server
          python -c "
          import sys
          sys.path.insert(0, '.')
          from config import AppConfig
          cfg = AppConfig.load('config.yaml')
          print('配置解析成功：', cfg.describe()['server'])
          "
